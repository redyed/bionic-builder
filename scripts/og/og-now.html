<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="card">
    <div class="glow-v"></div>
    <div class="glow-c"></div>
    <div class="grid"></div>
    <div class="content">
      <p class="eyebrow">Bionic Builder</p>
      <h1 class="display">Now</h1>
      <p class="sub">The weekly value ledger. What shipped. What it was worth.</p>
      <div class="rows" aria-hidden="true">
        <div class="row"><span class="dash"></span><span class="leader"></span><span class="dash short"></span></div>
        <div class="row"><span class="dash" style="width:36px"></span><span class="leader"></span><span class="dash" style="width:40px"></span></div>
        <div class="row"><span class="dash" style="width:42px"></span><span class="leader"></span><span class="dash short"></span></div>
      </div>
      <div class="foot">
        <span class="label">Updated Fridays</span>
        <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true">
          <g fill="none" stroke="#EDF0F7" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11 V53 M20 11 C36 11 47.5 13.5 47.5 22.5 C47.5 30.5 38 32 20 32 M20 32 C40 32 50.5 34.5 50.5 43.5 C50.5 52.5 39 53 20 53"/>
          </g>
          <circle cx="20" cy="32" r="3.1" fill="#3FE08C"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
